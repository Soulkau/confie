[package]
name = "confie"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Soulkau"]
description = "Simple compile-time configuration from TOML files."
repository = "https://github.com/Soulkau/confie"
readme = "README.md"
keywords = ["config", "configuration", "toml", "proc-macro"]
categories = ["config", "development-tools"]

[lib]
proc-macro=true

[dependencies]
toml = "1.1.8+spec-1.1.0"
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1"
